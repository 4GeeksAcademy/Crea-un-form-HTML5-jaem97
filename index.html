<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea un form HTML5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>



    <div class="container">
        <form class="row g-3 border">

            <div class="border p-2 px-3 bg-light">
                <h4><strong>Payment form example</strong></h4>
            </div>
            <div class="row p-4">

                <div class="alert alert-danger mx-2" role="alert">
                    Some field are missing
                </div>
                <div class="col-md-6">
                    <label for="inputCard" class="form-label">Card #</label>
                    <input type="text" class="form-control" id="inputCard" placeholder="XXXXXXXXXXXXXXXXXXXXX">
                </div>
                <div class="col-md-3">
                    <label for="inputCVC" class="form-label">CVC #</label>
                    <input type="number" class="form-control" id="inputCVC" placeholder="0000">
                </div>
                <div class="col-md-3">
                    <label for="inputAmount" class="form-label">Amount</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1"><i class="fa-solid fa-dollar-sign"></i></span>
                        <input type="number" class="form-control" placeholder="Amount" aria-label="Amount"
                            aria-describedby="basic-addon1">
                    </div>
                </div>
                <div class="col-6">
                    <label for="inputFirstName" class="form-label">First name</label>
                    <input type="text" class="form-control" id="inputFirstName">
                </div>
                <div class="col-6">
                    <label for="inputLastName" class="form-label">Last name</label>
                    <input type="text" class="form-control" id="inputLastName">
                </div>
                <div class="col-md-6">
                    <label for="inputCity" class="form-label">City</label>
                    <input type="text" class="form-control" id="inputCity">
                </div>
                <div class="col-md-3">
                    <label for="inputState" class="form-label">State</label>
                    <select id="inputState" class="form-select">
                        <option selected disabled>Pick a state</option>
                        <option>Spain</option>
                        <option>Portugal</option>
                        <option>France</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="inputZip" class="form-label">Postal code</label>
                    <input type="text" class="form-control" id="inputZip">
                </div>
                <div class="row mt-4 ps-4 pe-0">
                    <div class="col-6">
                        <p>We accepted:</p>
                        <div
                            class="bg-secondary rounded-2 d-inline-flex align-items-center justify-content-center w-auto h-auto p-2 justify-content-around">
                            <div class="form-check">
                                <input class="form-check-input bg-secondary" type="radio" name="radioDefault"
                                    id="radioDefault1">
                                <label class="form-check-label" for="radioDefault1">
                                    <i class="fa-brands fa-cc-mastercard text-light"></i>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input bg-secondary" type="radio" name="radioDefault"
                                    id="radioDefault2" checked>
                                <label class="form-check-label" for="radioDefault2">
                                    <i class="fa-brands fa-cc-visa text-light"></i>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input bg-secondary" type="radio" name="radioDefault"
                                    id="radioDefault2" checked>
                                <label class="form-check-label" for="radioDefault2">
                                    <i class="fa-brands fa-cc-diners-club text-light"></i>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input bg-secondary" type="radio" name="radioDefault"
                                    id="radioDefault2" checked>
                                <label class="form-check-label" for="radioDefault2">
                                    <i class="fa-brands fa-cc-apple-pay text-light"></i>
                                </label>
                            </div>
                        </div>

                    </div>
                    <div class="col-6">
                        <div class="form-floating">
                            <div class="mb-3">
                                <label for="exampleFormControlTextarea1" class="form-label">Message</label>
                                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                            </div>
                            <div id="passwordHelpBlock" class="form-text">
                                Add any notes here.
                            </div>
                        </div>
                    </div>


                </div>
            </div>


            <div class="col-12 border p-2 bg-light d-flex justify-content-end">
                <button type="submit" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary mx-2">Send</button>
            </div>


        </form>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
